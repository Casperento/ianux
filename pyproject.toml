[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ianux"
dynamic = ["version"]
description = "A quick-to-use tmux wrapper for managing sessions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
ianux = "ianux.__main__:entrypoint"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ianux.__version__"}
